# GitHub Pages (project page: https://<user>.github.io/neststudio/).
# Wymaga: Settings → Pages → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/nest-studio-title-sequence-3yjej7]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /neststudio
      NEXT_PUBLIC_SITE_URL: https://filipjakubiak.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Next nie przepisuje url() w CSS o basePath.
      - name: Prefix font URLs in CSS with basePath
        run: find out/_next -name '*.css' -exec sed -i "s#url(/fonts/#url($NEXT_PUBLIC_BASE_PATH/fonts/#g" {} +
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
